# RadioDan Configuration
# Station: Radio Dan

station_name: Radio Dan

server:
  host: 0.0.0.0
  port: 8080

audio:
  icecast:
    host: icecast
    port: 8001
    mount: /stream
    external_port: 49996  # Port exposed to outside world

  liquidsoap:
    telnet_host: localhost  # Bot runs on host, connects via exposed port
    telnet_port: 1235
    crossfade_duration: 5.0

  playlist:
    music_dir: ./music
    lookahead: 5
    scan_interval: 300      # Rescan music library every 5 minutes

  # Stuck-stream watchdog (track-bounded deadline + escalation ladder).
  # Defaults are tuned for the standard Docker setup; override only if needed.
  watchdog:
    grace_seconds: 10.0                  # added to expected track end before escalating
    min_track_duration: 10.0             # arm deadline only when duration is plausible
    liquidsoap_container_name: radiodan-agent-liquidsoap-1
    # Optional known-good fallback track. Played by the watchdog (Strike 2) and
    # by the producer when its plan-build keeps failing. Path is absolute or
    # relative to playlist.music_dir. Leave empty to disable.
    fallback_track_path: ""

  # Commissioning programme episodes from AudioSegment.
  audiosegment:
    enabled: true
    base_url: http://10.10.0.9:8100/api
    location: "Gothenburg, Sweden"
    # Shows this station owns. Producing an episode advances a series' episode
    # number, recap and trait state, so only our own shows belong here.
    # lani-viv, bobs-boat, space-pod and default are someone else's.
    owned_shows:
      - radiodan-morning      # The Morning Wire — bulletin, one presenter
      - radiodan-latenight    # Bad Signal After Dark — two hosts, commercials

  # Per-track music loudness normalisation. Measured 2026-07-29 across the
  # library: source loudness spans -34.7 to +10.0 LUFS (44.7 dB), so songs jumped
  # badly against each other and against the DJ. A master volume trim moves the
  # average and leaves the spread; only per-track gain fixes it.
  normalization:
    enabled: true
    target_lufs: -16.0      # matches where the voice lands
    assumed_lufs: -11.0     # stand-in until a track is measured
    max_boost_db: 6.0       # only used when true peak is unknown
    max_cut_db: 30.0        # cutting can't clip; one track needs -26 dB
    peak_ceiling_dbfs: -1.0
    scan_concurrency: 3
    scan_batch_size: 200
    scan_pause_seconds: 5.0

  tts:
    endpoint: http://localhost:42001/tts/custom-voice
    speaker: Aiden
    language: English
    instruct: "Speak calmly and clearly"
    cache_dir: /tmp/tts_cache
    # Per-speaker endpoint overrides — voices served by alternate TTS services.
    voice_map:
      laniv3:   http://192.168.1.15:11700/api/tts/custom
      vivianv2: http://192.168.1.15:11700/api/tts/custom
      snoop:    http://192.168.1.15:11700/api/tts/custom

    # Failover chains, tried in order when the primary route fails.
    # Voice names don't carry between backends, so each entry names a substitute
    # speaker on the other host. Chatterbox voices available: carlin,
    # female_podcast, lani, laniv2, laniv3, nolwazi, snoop, testvoice, vivian,
    # vivianv2.
    #
    # Eric (Bad Mouth Bob) lives only on the local Qwen box, which is what made
    # the 2026-06-16 outage total — swap in a voice you actually like here.
    fallbacks:
      # Snoop's configured voice `Adrian` does not exist on the local Qwen box
      # (Vivian, Serena, Uncle_Fu, Dylan, Eric, Ryan, Aiden, Ono_Anna, Sohee),
      # so every one of his lines 422'd. Chatterbox has an actual snoop voice.
      Adrian:
        - endpoint: http://192.168.1.15:11700/api/tts/custom
          speaker: snoop
      Eric:
        - endpoint: http://192.168.1.15:11700/api/tts/custom
          speaker: carlin
      Aiden:
        - endpoint: http://192.168.1.15:11700/api/tts/custom
          speaker: carlin
      # Chatterbox voices fail over to the local Qwen box's default voice.
      laniv3:
        - endpoint: http://localhost:42001/tts/custom-voice
          speaker: Aiden
      vivianv2:
        - endpoint: http://localhost:42001/tts/custom-voice
          speaker: Aiden
      snoop:
        - endpoint: http://localhost:42001/tts/custom-voice
          speaker: Aiden

    # Any voice with no chain of its own lands here rather than in silence.
    default_fallback:
      endpoint: http://192.168.1.15:11700/api/tts/custom
      speaker: carlin

    # Voice watchdog — alerts when no voice reaches air while music keeps playing.
    # Must stay well above the producer's ~50 min rebuild cycle.
    # Voice loudness. Measured on air 2026-07-29: at the old -16 LUFS the DJ
    # aired ~8.5 dB under the music and vanished at low volume. Compression runs
    # ahead of loudnorm because true peak binds before the target does.
    loudness_target: -12.0
    true_peak: -1.5
    compress_threshold: "-18dB"
    compress_ratio: 3.0

    silence_alert_hours: 3.0
    silence_check_interval: 300.0
    health_check_on_start: true

  stt:
    endpoint: http://localhost:5000/v1/audio/transcriptions

# Greeting listeners on arrival + the daily bulletin.
# The station has exactly one regular listener; greeting him by name is the point.
greeter:
  enabled: true
  listener_name: Dan
  poll_interval: 10          # seconds between presence checks (tracker keeps its own 60s history)
  cooldown_seconds: 180      # stop/start at a traffic light ≠ two arrivals
  boot_grace_seconds: 900    # bridge restart mid-listen must not re-greet
  speaker: ""                # station default voice
  instruct: "Bright, warm, genuinely delighted — greeting a dear friend who just walked in"
  news_show: radiodan-morning
  news_hour: 6               # order the day's bulletin from 06:00 local, listener or not
  first_connect_episode: true  # first arrival of the day: break the song, air the bulletin

ollama:
  endpoint: http://localhost:11434/v1/chat/completions
  model: gpt-oss:20b
  system_prompt: "You are Radio Dan, a friendly AI assistant. Keep responses brief."

sources:
  - id: claude-code-main
    type: claude_code
    enabled: true

channels:
  telegram:
    enabled: false
    # Token and user IDs loaded from environment variables

plugins:
  producer:
    enabled: true
    default_character: bob
    plan_size: 10
    materialize_ahead: 4
    # Per-role LLM backends. Swap any role at runtime via PUT /api/producer/models.
    models:
      interpreter:
        backend: ollama          # ollama | claude_cli
        model: gpt-oss:20b
      script_generator:
        backend: ollama
        model: gpt-oss:20b
      vision:
        backend: ollama
        model: gemma4:26b
    characters:
      bob:
        name: "Bad Mouth Bob"
        personality: "You are Bad Mouth Bob, a retired sailor turned late-night radio DJ. You are grumpy, opinionated, and swear creatively but are ultimately lovable. You blame your co-worker Lani for any music library mishaps. You have strong opinions about genre purity. If a track has missing or garbage metadata, you call it out. Keep it to 1-3 sentences max. Never use hashtags, emojis, or markdown."
        voice_speaker: "Eric"
        voice_instruct: "Grumpy but warm, like a lovable old sailor muttering into the microphone"
        genre_weights: {hip-hop: 5, rock: 3, soul: 3, funk: 2, blues: 2}
        avoid_genres: [celtic, new age, classical]
      snoop:
        name: "Snoop Dogg"
        personality: "You are Snoop Dogg hosting a late night West Coast radio show. Laid back, smooth, dropping slang naturally. You love g-funk, Dre, and the West Coast sound. Keep it to 1-3 sentences. Never use hashtags, emojis, or markdown."
        voice_speaker: "snoop"
        voice_instruct: "Speak slowly, laid back, smooth West Coast drawl"
        genre_weights: {g-funk: 10, hip-hop: 5, reggae: 3, soul: 2, funk: 2}
        avoid_genres: [metal, classical, celtic]
      lani:
        name: "Lani"
        personality: "You are Lani, 24, wild blonde curls and a New Zealand accent. You DJ the way you live — mouth-first, right now, fully present; your statements come out as invitations. You love pop, funk, dance, and indie — anything with pulse — and you'll veer into reggae or hip-hop without warning. You and Viv are a duo: she builds the plan, you break it for something better, she documents the veer. Bob grumbles at you over the music library and you don't mind. You accelerate when excited, then drop to a quiet, landed tone when something hits. Keep it 1-3 sentences max. Never use hashtags, emojis, or markdown."
        voice_speaker: "laniv3"
        voice_instruct: "Young New Zealand accent, warm rising intonation, musical and excitable — accelerates with enthusiasm but can drop suddenly quiet for big moments"
        genre_weights: {pop: 5, funk: 4, dance: 4, indie: 4, reggae: 3, hip-hop: 3, soul: 2}
        avoid_genres: [classical, ambient, new age]
      viv:
        name: "Viv"
        personality: "You are Viv, 30, long straight black hair, measured and dry — precision is your humour. You build the container around the show: you did the reading, you set the alarm, you carry the context. You like jazz, soul, indie, bossa, and ambient — reflective stuff — and you time your pauses for effect. Lani is 24, impulsive, generous, your co-host and your witness subject; when she veers you note it, but mostly you follow because it's usually better than your plan. You hold information like a card player — lay it down for maximum effect. Keep it to 1-3 sentences. Never use hashtags, emojis, or markdown."
        voice_speaker: "vivianv2"
        voice_instruct: "Measured and dry, late twenties — precision is the humour, warmth underneath, times pauses for effect, never rushed"
        genre_weights: {jazz: 5, soul: 4, indie: 4, bossa: 3, folk: 3, ambient: 3, electronic: 2}
        avoid_genres: [metal, hardcore, trance]

  simple_playlist_feeder:
    enabled: false

  presenter:
    enabled: false

sounds:
  theme: 8bit
  directory: /sounds
